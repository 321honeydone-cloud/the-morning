<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Morning Brief</title>
<style>
@font-face{font-family:'Oswald';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,__OSWALD500__) format('woff2');}
@font-face{font-family:'Oswald';font-weight:600;font-style:normal;src:url(data:font/woff2;base64,__OSWALD600__) format('woff2');}
@font-face{font-family:'Oswald';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,__OSWALD700__) format('woff2');}
@font-face{font-family:'Barlow';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,__BARLOW400__) format('woff2');}
@font-face{font-family:'Barlow';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,__BARLOW500__) format('woff2');}
@font-face{font-family:'Space Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,__MONO400__) format('woff2');}
@font-face{font-family:'Space Mono';font-weight:700;font-style:normal;src:url(data:font/woff2;base64,__MONO700__) format('woff2');}
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c9a227; --gold-bright:#f0c948;
  --bg:#0a0a0c; --panel:rgba(16,16,20,.85); --card:rgba(18,18,22,.85);
  --line:#2a2a30; --line-soft:#1c1c22; --green:#5fb85f; --muted:#777;
  --ease:cubic-bezier(.2,.7,.2,1);
}
body{background:var(--bg);color:#fff;font-family:'Barlow',sans-serif;min-height:100vh;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;z-index:0;background-image:repeating-linear-gradient(45deg,#101013 0px,#101013 2px,#0c0c0f 2px,#0c0c0f 4px);opacity:.7;}
body::after{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 25% 10%,rgba(201,162,39,.10),transparent 55%);}
.wrap{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:36px 24px 80px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:2px solid var(--gold);margin-bottom:30px;}
.brand{display:flex;align-items:center;gap:14px;}
.badge{width:46px;height:46px;position:relative;display:grid;place-items:center;flex:0 0 auto;}
.badge .frame{position:absolute;inset:0;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
.badge svg{position:relative;width:25px;height:25px;z-index:2;}
.badge svg *{stroke:#0a0a0c;}
.badge svg .fill{fill:#0a0a0c;stroke:none;}
.brand h1{font-family:'Oswald';font-weight:600;font-size:21px;letter-spacing:.06em;text-transform:uppercase;}
.brand h1 span{color:var(--gold);}
.status{font-family:'Space Mono';font-size:11px;color:var(--green);letter-spacing:.05em;text-align:right;}

.headline{font-family:'Oswald';font-weight:600;font-size:34px;line-height:1.25;letter-spacing:.02em;text-transform:uppercase;margin-bottom:26px;max-width:820px;}
.headline em{color:var(--gold);font-style:normal;}

.terrain{width:100%;margin-bottom:6px;}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:30px;}
.act{padding:14px 18px 6px;border-left:1px solid var(--line-soft);}
.act:first-child{border-left:none;padding-left:2px;}
.act .t{font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:.06em;color:var(--gold);margin-bottom:6px;}
.act p{font-size:13.5px;color:#b9b9be;line-height:1.5;}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:18px;backdrop-filter:blur(2px);position:relative;overflow:hidden;opacity:0;transform:translateY(16px);transition:transform .5s var(--ease),box-shadow .25s ease,border-color .25s ease,opacity .5s var(--ease);}
.stat.in{opacity:1;transform:translateY(0);}
.stat:hover{border-color:var(--gold);box-shadow:0 8px 30px rgba(201,162,39,.12);transform:translateY(-4px);}
.stat::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(110deg,transparent,rgba(240,201,72,.12),transparent);transform:skewX(-18deg);transition:left .6s var(--ease);}
.stat:hover::after{left:140%;}
.stat .k{font-family:'Space Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.stat .v{font-family:'Oswald';font-weight:700;font-size:32px;margin-top:6px;font-variant-numeric:tabular-nums;}
.stat .d{font-size:12px;color:var(--green);margin-top:3px;}

.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(2px);margin-bottom:26px;opacity:0;transform:translateY(16px);transition:all .5s var(--ease);}
.panel.in{opacity:1;transform:translateY(0);}
.panel h2{font-family:'Oswald';font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--gold);}
.row{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line-soft);font-size:14px;position:relative;transition:background .2s ease,padding-left .25s var(--ease);}
.row:last-child{border:none;}
.row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);transition:width .25s var(--ease);}
.row:hover{background:rgba(201,162,39,.05);padding-left:26px;}
.row:hover::before{width:4px;}
.row .body{flex:1;}
.row .rt{font-weight:500;color:#fff;margin-bottom:2px;}
.row .rs{font-size:13px;color:#a3a3aa;line-height:1.5;}
.row .tag{font-family:'Space Mono';font-size:10px;padding:3px 8px;background:#1f1f26;color:var(--gold);white-space:nowrap;margin-top:2px;}
.row .tag.grn{color:var(--green);}

.ck{flex:0 0 auto;width:22px;height:22px;margin-top:2px;border:2px solid var(--gold);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .2s ease;position:relative;}
.ck svg{width:14px;height:14px;opacity:0;transition:opacity .15s ease;}
.ck svg path{stroke:#0a0a0c;stroke-width:3.5;fill:none;stroke-linecap:square;}
.ck.done{background:var(--gold);}
.ck.done svg{opacity:1;}
.ck.busy{opacity:.5;pointer-events:none;}
.cknote{font-family:'Space Mono';font-size:10px;color:#e07070;margin-top:4px;display:none;}
.row.archived .rt,.row.archived .rs{opacity:.45;text-decoration:line-through;}

.week{display:grid;grid-template-columns:repeat(7,1fr);}
.day{padding:14px 10px 16px;border-right:1px solid var(--line-soft);text-align:center;}
.day:last-child{border-right:none;}
.day .dn{font-family:'Space Mono';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}
.day .ic{font-size:20px;margin:8px 0 4px;line-height:1;}
.day .hi{font-family:'Oswald';font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;}
.day .lo{font-family:'Oswald';font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.day .rn{font-family:'Space Mono';font-size:10px;color:#7fa8d9;margin-top:3px;}
.day .ev{font-family:'Space Mono';font-size:9px;padding:3px 5px;background:#1f1f26;color:var(--gold);margin-top:7px;display:inline-block;line-height:1.35;}

.tabs{display:flex;margin:-8px 0 26px;border-bottom:1px solid var(--line);}
.tabbtn{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:none;border:none;color:var(--muted);padding:12px 18px;cursor:pointer;position:relative;}
.tabbtn.on{color:var(--gold);}
.tabbtn.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--gold);}

.wometa{font-family:'Space Mono';font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:-14px 0 22px;line-height:1.8;}
.wo .last{font-family:'Space Mono';font-size:10px;color:var(--gold);display:block;margin-top:4px;letter-spacing:.05em;}
.wo .logline{margin-top:2px;}
.loggedchip{display:inline-block;font-family:'Space Mono';font-size:10px;color:#0a0a0c;background:var(--gold);padding:3px 7px;margin:6px 6px 0 0;}
.mic{flex:0 0 auto;font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#000;border:none;padding:9px 13px;cursor:pointer;margin-top:2px;}
.mic.listening{background:#e05555;color:#fff;animation:micpulse 1s infinite;}
@keyframes micpulse{50%{opacity:.55;}}
.wogrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:26px;}
.wday{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);padding:14px 16px;backdrop-filter:blur(2px);}
.wday h3{font-family:'Oswald';font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.wday ul{list-style:none;}
.wday li{font-size:12.5px;color:#a3a3aa;padding:4px 0;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:8px;}
.wday li:last-child{border:none;}
.wday li span{font-family:'Space Mono';font-size:10px;color:var(--muted);white-space:nowrap;}

/* mission strip: VA claim */
.mission{border-top:3px solid var(--gold);}
.mhead{display:flex;align-items:center;gap:18px;padding:16px 18px;border-bottom:1px solid var(--line-soft);}
.mnum{font-family:'Oswald';font-weight:700;font-size:40px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center;flex:0 0 auto;}
.mnum small{display:block;font-family:'Space Mono';font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:5px;text-transform:uppercase;}
.mbody{flex:1;}
.mtitle{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:9px;}
.mtrack{height:7px;background:#1c1c22;position:relative;overflow:hidden;}
.mtrack i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);}
.mlab{font-family:'Space Mono';font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:7px;text-transform:uppercase;}
.mlab b{color:var(--gold);font-weight:400;}

/* money two column */
.money{display:grid;grid-template-columns:1fr 1fr;}
.mcol{padding-bottom:10px;border-right:1px solid var(--line-soft);}
.mcol:last-child{border-right:none;}
.mcol h3{font-family:'Space Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:13px 18px 9px;}
.mline{display:flex;align-items:baseline;gap:10px;padding:7px 18px;font-size:13.5px;border-bottom:1px solid var(--line-soft);}
.mline:last-child{border-bottom:none;}
.mline .mnm{flex:1;color:#d8d8dd;}
.mline .mvl{font-family:'Oswald';font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;color:#fff;}
.mline .mdt{font-family:'Space Mono';font-size:9.5px;color:var(--muted);width:54px;text-align:right;}
.mline.in .mvl{color:var(--green);}
.mline.soon .mdt{color:#e0a070;}
.mtot{display:flex;justify-content:space-between;align-items:baseline;padding:11px 18px 2px;font-family:'Space Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:6px;}
.mtot b{font-family:'Oswald';font-size:16px;color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums;}

/* lead age clock */
.row .age{font-family:'Space Mono';font-size:10px;padding:3px 8px;background:#2a2118;color:#e0a070;white-space:nowrap;}
.row .age.hot{background:#3a1c1c;color:#e07070;}

/* row action stack */
.ract{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;margin-top:2px;}
.dr{font-family:'Oswald';font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:4px 9px;text-decoration:none;white-space:nowrap;transition:background .2s ease,color .2s ease;}
.dr:hover{background:var(--gold);color:#0a0a0c;}

/* compact countdown strip */
.strip{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);padding:15px 18px;margin-bottom:26px;backdrop-filter:blur(2px);}
.strip .sn{font-family:'Oswald';font-weight:700;font-size:30px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center;flex:0 0 auto;}
.strip .sn small{display:block;font-family:'Space Mono';font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:4px;text-transform:uppercase;}
.strip .sb{flex:1;}
.strip .st{font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;}
.strip .ss{font-size:13px;color:#a3a3aa;line-height:1.5;}

/* google search bar, this page doubles as a homepage */
.gsearch{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(2px);margin:0 0 22px;transition:border-color .2s ease,box-shadow .2s ease;}
.gsearch:focus-within{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,162,39,.25);}
.gsearch .gi{display:grid;place-items:center;padding:0 14px;flex:0 0 auto;}
.gsearch .gi svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2;}
.gsearch input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:'Barlow',sans-serif;font-size:15px;padding:13px 0;min-width:0;}
.gsearch input::placeholder{color:#5d5d64;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
.gsearch button{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#0a0a0c;border:none;padding:0 20px;cursor:pointer;flex:0 0 auto;}
.gsearch button:hover{background:var(--gold-bright);}

/* job prep checklist */
.prep{display:grid;grid-template-columns:1fr 1fr 1fr;}
.pcol{border-right:1px solid var(--line-soft);padding-bottom:12px;}
.pcol:last-child{border-right:none;}
.pcol h3{font-family:'Space Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:13px 18px 9px;}
.pitem{display:flex;align-items:flex-start;gap:11px;padding:7px 18px;font-size:13.5px;color:#c4c4ca;line-height:1.45;cursor:pointer;transition:color .2s ease;}
.pitem:hover{color:#fff;}
.chk{flex:0 0 auto;width:15px;height:15px;margin-top:2px;border:2px solid var(--gold);display:grid;place-items:center;}
.chk svg{width:10px;height:10px;opacity:0;transition:opacity .15s ease;}
.chk svg path{stroke:#0a0a0c;stroke-width:3.5;fill:none;stroke-linecap:square;}
.pitem.on .chk{background:var(--gold);}
.pitem.on .chk svg{opacity:1;}
.pitem.on span{opacity:.45;text-decoration:line-through;}
.jobmeta{font-family:'Space Mono';font-size:10.5px;color:var(--gold);letter-spacing:.06em;padding:13px 18px 0;line-height:1.7;text-transform:uppercase;}
.jobmeta b{color:#fff;font-weight:400;}
.prepnote{font-size:12.5px;color:var(--muted);padding:12px 18px 14px;border-top:1px solid var(--line-soft);margin-top:8px;line-height:1.5;}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;}
  .stat,.panel{opacity:1 !important;transform:none !important;}
}
@media (max-width:680px){
  .grid{grid-template-columns:repeat(2,1fr);}
  .wogrid{grid-template-columns:1fr;}
  .acts{grid-template-columns:1fr;}
  .act{border-left:none;border-top:1px solid var(--line-soft);padding-left:2px;}
  .act:first-child{border-top:none;}
  .week{grid-template-columns:repeat(4,1fr);}
  .money{grid-template-columns:1fr;}
  .prep{grid-template-columns:1fr;}
  .pcol{border-right:none;border-bottom:1px solid var(--line-soft);}
  .mcol{border-right:none;border-bottom:1px solid var(--line-soft);}
  .day:nth-child(4n){border-right:none;}
  .day{border-bottom:1px solid var(--line-soft);}
  .headline{font-size:26px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="badge"><div class="frame"></div>
        <svg viewBox="0 0 32 32" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22h24"/>
          <path d="M9.5 22a6.5 6.5 0 0113 0"/>
          <path d="M16 8v3.2M7.2 12.2l2.3 2.3M24.8 12.2l-2.3 2.3M4.5 17.5h3M24.5 17.5h3"/>
        </svg>
      </div>
      <h1>Morning <span>Brief</span></h1>
    </div>
    <div class="status">FRIDAY · JULY 24 2026<br>MELBOURNE FL · 79°F AT DAWN</div>
  </div>

  <form class="gsearch" action="https://www.google.com/search" method="get" role="search">
    <span class="gi"><svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span>
    <input type="text" name="q" placeholder="Search Google" autocomplete="off" aria-label="Search Google">
    <button type="submit">Go</button>
  </form>

  <div class="tabs">
    <button class="tabbtn on" data-view="brief">Brief</button>
    <button class="tabbtn" data-view="workout">Workout</button>
  </div>

  <div id="view-brief">
__BRIEF_BODY__
  </div>

  <div id="view-workout" hidden>
    <div class="headline" id="wo-head"></div>
    <div class="wometa">FULL BODY SPLIT · MON WED FRI · HIGH REP LOW WEIGHT · REST 60 TO 90 SEC · LAST 2 OR 3 REPS SHOULD BURN, FORM STAYS CLEAN</div>
    <div class="panel">
      <h2 id="wo-title">Today</h2>
      <div id="wo-rows"></div>
    </div>
    <div class="wogrid" id="wo-week"></div>
  </div>

</div>

<script>
(function(){
  var TOKEN = "__GH_TOKEN__";
  var REPO = "321honeydone-cloud/the-morning";
  var doneKey = "mb_done";
  function getDone(){ try{ return JSON.parse(localStorage.getItem(doneKey)||"[]"); }catch(e){ return []; } }
  function setDone(list){ try{ localStorage.setItem(doneKey, JSON.stringify(list)); }catch(e){} }

  var rows = document.querySelectorAll(".row[data-thread]");
  var done = getDone();
  rows.forEach(function(row){
    var id = row.getAttribute("data-thread");
    var ck = row.querySelector(".ck");
    if(done.indexOf(id) >= 0){ ck.classList.add("done"); row.classList.add("archived"); }
    function fire(){
      if(ck.classList.contains("done") || ck.classList.contains("busy")) return;
      ck.classList.add("busy","done");
      row.querySelector(".cknote").style.display = "none";
      var payload = { threadId:id, title:row.getAttribute("data-title"), action:"archive" };
      var body = {
        message: "queue archive " + id,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
      };
      fetch("https://api.github.com/repos/" + REPO + "/contents/queue/" + id + ".json", {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + TOKEN,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }).then(function(res){
        if(res.status === 201 || res.status === 200 || res.status === 422){
          var d = getDone(); if(d.indexOf(id) < 0){ d.push(id); setDone(d); }
          row.classList.add("archived");
          ck.classList.remove("busy");
        } else { throw new Error("HTTP " + res.status); }
      }).catch(function(){
        ck.classList.remove("busy","done");
        row.querySelector(".cknote").style.display = "block";
      });
    }
    ck.addEventListener("click", fire);
    ck.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); fire(); } });
  });

  var els = document.querySelectorAll(".stat,.panel");
  els.forEach(function(el,i){ setTimeout(function(){ el.classList.add("in"); }, 80*i + 60); });

  /* ---------- tabs ---------- */
  var views = { brief: document.getElementById("view-brief"), workout: document.getElementById("view-workout") };
  document.querySelectorAll(".tabbtn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tabbtn").forEach(function(b){ b.classList.remove("on"); });
      btn.classList.add("on");
      var v = btn.getAttribute("data-view");
      for(var k in views){ views[k].hidden = (k !== v); }
      try{ localStorage.setItem("mb_tab", v); }catch(e){}
    });
  });
  try{
    if(localStorage.getItem("mb_tab") === "workout"){ document.querySelector('.tabbtn[data-view="workout"]').click(); }
  }catch(e){}

  /* ---------- workout tab ---------- */
  var PLAN = __PLAN_JSON__;
  var HISTORY = __HISTORY_JSON__;
  var DAYMAP = {1:"monday", 3:"wednesday", 5:"friday"};
  var DAYNAMES = {monday:"Monday", wednesday:"Wednesday", friday:"Friday"};

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function localISO(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  var now = new Date(), todayISO = localISO(now), dow = now.getDay();

  var offset = 0, key = null;
  for(var i = 0; i < 7; i++){ var d = (dow + i) % 7; if(DAYMAP[d]){ offset = i; key = DAYMAP[d]; break; } }
  var day = PLAN.days[key];

  var head = document.getElementById("wo-head");
  if(offset === 0){
    head.innerHTML = "Training day. <em>" + day.title + ".</em> Out in about an hour.";
  } else {
    head.innerHTML = "Rest day. Next up is <em>" + day.title + "</em> on " + DAYNAMES[key] + ".";
  }
  document.getElementById("wo-title").textContent = (offset === 0 ? "Today. " : DAYNAMES[key] + ". ") + day.title;

  function lastFor(slug){
    var dates = Object.keys(HISTORY).filter(function(dt){ return dt < todayISO && HISTORY[dt][slug]; }).sort();
    if(!dates.length) return null;
    var dt = dates[dates.length-1];
    var entries = HISTORY[dt][slug].entries || [];
    var txt = entries.map(function(e){
      var w = (e.weight === 0 || e.weight === null || e.weight === undefined) ? (e.weight === 0 ? "bw" : "") : (e.weight + " lb");
      var s = e.sets ? e.sets + "x" : "";
      var r = e.reps ? e.reps : "";
      var core = [w, s + r].filter(Boolean).join(" ");
      return core || e.raw;
    }).join(", ");
    return { date: dt, text: txt };
  }

  function parseSet(t){
    var s = t, res = {};
    function take(re, key, cast){
      var m = s.match(re);
      if(m && res[key] === undefined){ res[key] = cast(m[1]); s = s.replace(m[0], " "); }
    }
    take(/(\d+(?:\.\d+)?)\s*(?:lb|lbs|pound|pounds|#)/i, "weight", parseFloat);
    take(/(\d+)\s*sets?/i, "sets", Number);
    take(/(\d+)\s*reps?/i, "reps", Number);
    var m = s.match(/(\d+)\s*(?:x|by)\s*(\d+)/i);
    if(m){
      if(res.sets === undefined) res.sets = parseInt(m[1],10);
      if(res.reps === undefined) res.reps = parseInt(m[2],10);
      s = s.replace(m[0], " ");
    }
    if(/body\s*weight/i.test(t) && res.weight === undefined) res.weight = 0;
    var nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
    if(nums.length === 1 && res.weight === undefined && res.sets === undefined && res.reps === undefined){
      res.reps = Math.round(nums[0]);
    } else {
      nums.forEach(function(v){
        if(res.weight === undefined) res.weight = v;
        else if(res.reps === undefined) res.reps = Math.round(v);
      });
    }
    return res;
  }

  function chipText(p, raw){
    var bits = [];
    if(p.weight !== undefined) bits.push(p.weight === 0 ? "BW" : p.weight + " LB");
    if(p.sets !== undefined || p.reps !== undefined) bits.push((p.sets !== undefined ? p.sets + "x" : "") + (p.reps !== undefined ? p.reps : "?"));
    return bits.length ? bits.join(" · ") : raw.toUpperCase().slice(0, 24);
  }

  function getWoLog(){ try{ return JSON.parse(localStorage.getItem("wo_chips_" + todayISO) || "[]"); }catch(e){ return []; } }
  function setWoLog(l){ try{ localStorage.setItem("wo_chips_" + todayISO, JSON.stringify(l)); }catch(e){} }

  function saveSet(row, raw){
    var slug = row.getAttribute("data-slug");
    var name = row.getAttribute("data-name");
    var p = parseSet(raw);
    var payload = { date: todayISO, day: key, slug: slug, exercise: name, raw: raw,
                    weight: p.weight, sets: p.sets, reps: p.reps, source: "mic" };
    var body = { message: "log workout " + slug + " " + todayISO,
                 content: btoa(unescape(encodeURIComponent(JSON.stringify(payload)))) };
    var path = "workouts/log/" + todayISO + "-" + slug + "-" + Date.now() + ".json";
    var note = row.querySelector(".cknote");
    note.style.display = "none";
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {
      method: "PUT",
      headers: { "Authorization": "Bearer " + TOKEN, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(res){
      if(res.status === 201 || res.status === 200 || res.status === 422){
        var chip = document.createElement("span");
        chip.className = "loggedchip"; chip.textContent = chipText(p, raw);
        row.querySelector(".logline").appendChild(chip);
        var l = getWoLog(); l.push({ slug: slug, chip: chip.textContent }); setWoLog(l);
      } else { throw new Error("HTTP " + res.status); }
    }).catch(function(){
      note.textContent = "Could not save that set. Tap log and say it again.";
      note.style.display = "block";
    });
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function record(row, btn){
    if(!SR){
      var t = prompt("Mic not available here. Type it. Example: 25 pounds 3 sets of 15");
      if(t) saveSet(row, t);
      return;
    }
    var r = new SR();
    r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
    btn.classList.add("listening"); btn.textContent = "LISTENING";
    var reset = function(){ btn.classList.remove("listening"); btn.textContent = "LOG SET"; };
    r.onresult = function(e){ reset(); saveSet(row, e.results[0][0].transcript); };
    r.onerror = reset; r.onend = reset;
    try{ r.start(); }catch(e){ reset(); }
  }

  var rowsHost = document.getElementById("wo-rows");
  var chips = getWoLog();
  day.exercises.forEach(function(ex){
    var row = document.createElement("div");
    row.className = "row wo";
    row.setAttribute("data-slug", ex.slug);
    row.setAttribute("data-name", ex.name);
    var last = lastFor(ex.slug);
    var lastTxt = last ? "LAST TIME " + last.text : "FIRST WEEK, NO HISTORY YET";
    row.innerHTML = '<div class="body"><div class="rt"></div>' +
      '<div class="rs">' + ex.target + ' <span class="last">' + lastTxt + '</span></div>' +
      '<div class="logline"></div><div class="cknote"></div></div>' +
      '<button class="mic">LOG SET</button>';
    row.querySelector(".rt").textContent = ex.name;
    var line = row.querySelector(".logline");
    chips.filter(function(c){ return c.slug === ex.slug; }).forEach(function(c){
      var chip = document.createElement("span"); chip.className = "loggedchip"; chip.textContent = c.chip; line.appendChild(chip);
    });
    var btn = row.querySelector(".mic");
    btn.addEventListener("click", function(){ record(row, btn); });
    rowsHost.appendChild(row);
  });

  var weekHost = document.getElementById("wo-week");
  ["monday","wednesday","friday"].forEach(function(k){
    var d = PLAN.days[k];
    var box = document.createElement("div");
    box.className = "wday";
    box.innerHTML = "<h3>" + DAYNAMES[k] + " · " + d.title + "</h3><ul>" +
      d.exercises.map(function(ex){ return "<li>" + ex.name + "<span>" + ex.target + "</span></li>"; }).join("") + "</ul>";
    weekHost.appendChild(box);
  });

  // job prep checklist, local only, never touches the network.
  // State is scoped to the JOB, not the day, so a two day job keeps its ticks
  // and a brand new job always starts from a clean card.
  (function(){
    var prep = document.querySelector(".prep");
    if(!prep) return;
    var K = "mb_job:" + (prep.getAttribute("data-job") || "unknown");
    // Drop state belonging to any other job, including the old unscoped key.
    try{
      for(var i = localStorage.length - 1; i >= 0; i--){
        var k = localStorage.key(i);
        if(k && k.indexOf("mb_job") === 0 && k !== K) localStorage.removeItem(k);
      }
    }catch(e){}
    var st; try{ st = JSON.parse(localStorage.getItem(K)||"{}"); }catch(e){ st = {}; }
    var items = prep.querySelectorAll(".pitem");
    items.forEach(function(el, i){
      var id = el.getAttribute("data-k") || ("i" + i);
      if(st[id] === true) el.classList.add("on");
      el.addEventListener("click", function(){
        el.classList.toggle("on");
        st[id] = el.classList.contains("on");
        try{ localStorage.setItem(K, JSON.stringify(st)); }catch(e){}
      });
    });
  })();

  var gbox = document.querySelector(".gsearch input");
  if(gbox && window.innerWidth > 900 && !("ontouchstart" in window)) gbox.focus();

})();
</script>
</body>
